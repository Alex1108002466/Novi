services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: miu
      POSTGRES_PASSWORD: miu_password
      POSTGRES_DB: miu_guide
    ports:
      - "5432:5432"
    volumes:
      - miu_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://miu:miu_password@db:5432/miu_guide
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  miu_pgdata: