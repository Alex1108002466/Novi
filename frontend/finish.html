<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Вы на месте — Novi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="screen">

    <div class="topbar">
      <span>
      <a href="https://mi.university/" class="location-link">ММУ</a> · Корпус 1
      </span>
      <span>Novi</span>
    </div>

    <div class="spacer"></div>
    <div class="hero-mascot">

      <svg class="mascot mascot--celebrate" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Novi, маскот-книга, прыгает и радуется двумя руками">
        <g class="mascot__body">

          <rect class="mascot__leg mascot__leg--left" x="34" y="122" width="12" height="18" rx="6" fill="var(--mascot-blue)"/>
          <rect class="mascot__leg mascot__leg--right" x="74" y="122" width="12" height="18" rx="6" fill="var(--mascot-blue)"/>

          <rect class="mascot__wave-arm mascot__wave-arm--left" x="4" y="66" width="30" height="12" rx="6" fill="var(--mascot-blue)"/>

          <rect x="26" y="18" width="68" height="112" rx="14" fill="var(--mascot-blue)"/>
          <rect x="82" y="18" width="12" height="112" rx="6" fill="#3E64DA"/>

          <path d="M56 18H72V44L64 37L56 44V18Z" fill="var(--accent)"/>

          <circle cx="48" cy="66" r="8" fill="white"/>
          <circle cx="48" cy="67" r="3.4" fill="var(--ink)"/>
          <circle cx="70" cy="66" r="8" fill="white"/>
          <circle cx="70" cy="67" r="3.4" fill="var(--ink)"/>
          <path d="M45 82C50 92 66 92 71 82" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>

          <rect class="mascot__wave-arm mascot__wave-arm--right" x="86" y="66" width="30" height="12" rx="6" fill="var(--mascot-blue)"/>
        </g>
      </svg>

      <div class="route-line route-line--short"></div>
      <div class="bubble">Ура, дошли!&nbsp;<br>
        Ты справился(ась) на отлично
      </div>

    </div>

    <div style="margin-top: 20px;">
      <p class="eyebrow">Маршрут завершён</p>
      <h1>Поздравляем<br/>с прибытием!</h1>
      <p class="lede">
        Novi проводил тебя до нужной аудитории. Возвращайся, когда снова понадобится дорога
      </p>
    </div>

    <div class="spacer"></div>

    <a href="index.html" class="btn-primary tag">
      <span>На главную</span>
      <span class="btn-primary__arrow" aria-hidden="true">→</span>
    </a>
  </div>

</body>
</html>
