<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Карта — Novi</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>

  <div class="screen">

    <div class="topbar">
      <a href="choice.html" class="topbar__back" aria-label="Назад">← Назад</a>
      <span><a href="https://mi.university/" class="location-link">ММУ</a> · Корпус 1</span>
    </div>

    <p class="eyebrow">Карта корпуса</p>
    <h1>Выбери этаж</h1>

    <div class="floor-switch">
      <button type="button" class="floor-switch__btn floor-switch__btn--active" data-floor="1">1</button>
      <button type="button" class="floor-switch__btn" data-floor="2">2</button>
      <button type="button" class="floor-switch__btn" data-floor="3">3</button>
      <button type="button" class="floor-switch__btn" data-floor="4">4</button>
      <button type="button" class="floor-switch__btn" data-floor="5">5</button>
      <button type="button" class="floor-switch__btn" data-floor="6">6</button>
    </div>

    <div id="mapStage" class="map-placeholder"></div>

    <div class="route-manual">
      <div class="route-manual__field">
        <input type="text" id="startInput" class="route-manual__input" list="startDatalist"
               placeholder="Откуда" autocomplete="off" />
        <datalist id="startDatalist"></datalist>
      </div>
      <div class="route-manual__field">
        <input type="text" id="destInput" class="route-manual__input" list="destDatalist"
               placeholder="Куда" autocomplete="off" />
        <datalist id="destDatalist"></datalist>
      </div>
      <button type="button" id="buildRouteBtn" class="route-manual__btn">Построить маршрут</button>
      <button type="button" id="clearSelectionBtn" class="route-manual__btn route-manual__btn--ghost">Сбросить</button>
      <button type="button" id="finishRouteBtn" class="route-manual__btn">Завершить</button>
    </div>

    <div id="routeControls" class="route-controls" style="display:none;">
      <div class="route-controls__row">
        <button type="button" id="routePrevBtn">← Назад</button>
        <span id="routeStepLabel" class="route-controls__label"></span>
        <button type="button" id="routeNextBtn">Дальше →</button>
      </div>
      <p id="routeInstruction" class="route-controls__instruction"></p>
    </div>

  </div>

  <script src="floors/floor_1_data.js"></script>
  <script src="floors/floor_2_data.js"></script>
  <script src="floors/floor_3_data.js"></script>
  <script src="floors/floor_4_data.js"></script>
  <script src="floors/floor_5_data.js"></script>
  <script src="floors/floor_6_data.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
